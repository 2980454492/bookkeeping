<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人记账</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- 记账页（第一格） -->
        <main id="pane-records" class="tab-pane active">
        <!-- 页面头部 -->
        <header class="header">
            <h1>💰 个人记账</h1>
            <span class="version">v1.0</span>
        </header>

        <!-- 汇总卡片 -->
        <div class="summary">
            <div class="card income-card">
                <div class="card-label">总收入</div>
                <div class="card-value" id="sumIncome">¥0.00</div>
            </div>
            <div class="card expense-card">
                <div class="card-label">总支出</div>
                <div class="card-value" id="sumExpense">¥0.00</div>
            </div>
            <div class="card balance-card">
                <div class="card-label">结余</div>
                <div class="card-value" id="sumBalance">¥0.00</div>
            </div>
        </div>

        <!-- 新增记录入口：点击打开弹窗 -->
        <div class="section add-entry">
            <button type="button" class="btn btn-primary" id="btnOpenAdd">➕ 添加记录</button>
        </div>

        <!-- 筛选与记录列表 -->
        <div class="section">
            <h2>记录列表</h2>

            <!-- 筛选面板：类型 / 分类 / 日期区间 / 金额区间 / 关键字 / 排序 -->
            <h3 class="panel-title">筛选</h3>
            <div class="filters">
                <div class="filter-item">
                    <label for="filterType">类型</label>
                    <select id="filterType">
                        <option value="">全部类型</option>
                        <option value="expense">仅支出</option>
                        <option value="income">仅收入</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="filterCatL1">一级分类</label>
                    <select id="filterCatL1">
                        <option value="">全部分类</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="filterCatL2">二级分类</label>
                    <select id="filterCatL2">
                        <option value="">全部二级</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="filterAmountMin">最小金额</label>
                    <input type="number" id="filterAmountMin" placeholder="不限" step="0.01" min="0">
                </div>
                <div class="filter-item">
                    <label for="filterAmountMax">最大金额</label>
                    <input type="number" id="filterAmountMax" placeholder="不限" step="0.01" min="0">
                </div>
                <div class="filter-item">
                    <label for="filterDateFrom">开始日期</label>
                    <input type="date" id="filterDateFrom">
                </div>
                <div class="filter-item">
                    <label for="filterDateTo">结束日期</label>
                    <input type="date" id="filterDateTo">
                </div>
                <div class="filter-item">
                    <label for="filterKeyword">关键字</label>
                    <input type="text" id="filterKeyword" placeholder="备注/分类/金额" maxlength="50">
                </div>
                <!-- 快捷日期 + 操作按钮 -->
                <div class="quick-dates">
                    <button type="button" class="btn btn-sm" data-range="thisMonth">本月</button>
                    <button type="button" class="btn btn-sm" data-range="lastMonth">上月</button>
                    <button type="button" class="btn btn-sm" data-range="thisYear">今年</button>
                    <button type="button" class="btn btn-sm" data-range="all">全部</button>
                </div>
            </div>

            <!-- 分隔线：上方为筛选条件，下方为排序设置 -->
            <hr class="filter-divider">

            <!-- 排序面板 -->
            <h3 class="panel-title">排序</h3>
            <div class="filters sort-panel">
                <div class="filter-item">
                    <label for="filterSortBy">排序字段</label>
                    <select id="filterSortBy">
                        <option value="datetime">按时间</option>
                        <option value="amount">按金额</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="filterSortOrder">排序方向</label>
                    <select id="filterSortOrder">
                        <option value="desc">降序</option>
                        <option value="asc">升序</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary btn-sm" id="btnSearch">🔍 查询</button>
                    <button class="btn btn-sm" id="btnReset">↺ 重置</button>
                    <span class="record-count" id="recordCount">0 条记录</span>
                </div>
            </div>

            <div class="table-wrap">
                <table id="recordTable">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>类型</th>
                            <th>金额</th>
                            <th>一级分类</th>
                            <th>二级分类</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordBody">
                        <tr class="empty-row">
                            <td colspan="6">暂无记录，添加一条吧 🎉</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        </main>

        <!-- 统计页（第二格） -->
        <main id="pane-stats" class="tab-pane">
            <header class="header">
                <h1>📊 收支统计</h1>
                <span class="version" id="statsDateLabel"></span>
            </header>

            <!-- 年份选择（自定义列表：当前年在顶部，上滑之后、下滑之前） -->
            <div class="stats-year-toolbar">
                <label for="statsYearTrigger">年份</label>
                <div class="year-picker" id="statsYearPicker">
                    <button type="button" class="year-picker-trigger" id="statsYearTrigger"
                            aria-haspopup="listbox" aria-expanded="false" aria-label="选择统计年份">
                        <span id="statsYearDisplay">2026年</span>
                        <span class="year-picker-chevron" aria-hidden="true">▾</span>
                    </button>
                    <div class="year-picker-panel" id="statsYearPanel" role="listbox" hidden>
                        <ul class="year-picker-list" id="statsYearList"></ul>
                    </div>
                </div>
            </div>

            <!-- 年：各月柱状图（1—12月，可点击跳转） -->
            <div class="section">
                <h2 id="statsYearTitle">今年各月</h2>
                <div class="chart-legend">
                    <span class="legend-item"><i class="legend-dot income"></i>收入</span>
                    <span class="legend-item"><i class="legend-dot expense"></i>支出</span>
                </div>
                <div class="chart-panel">
                    <div class="chart-y-axis" id="statsYAxis" aria-hidden="true"></div>
                    <div class="chart-body">
                        <div class="bar-chart" id="statsYearChart"></div>
                    </div>
                </div>
            </div>

            <!-- 月：日历按日汇总 -->
            <div class="section">
                <h2 id="statsMonthTitle">本月日历</h2>
                <div class="calendar" id="statsCalendar">
                    <div class="cal-weekdays">
                        <span>日</span><span>一</span><span>二</span><span>三</span>
                        <span>四</span><span>五</span><span>六</span>
                    </div>
                    <div class="cal-grid" id="statsCalGrid"></div>
                </div>
            </div>

            <!-- 日：当日记录列表 -->
            <div class="section">
                <h2 id="statsDayTitle">今日记录</h2>
                <div class="stats-day-summary">
                    <span class="stats-mini income">收入 <strong id="statsDayIncome">¥0.00</strong></span>
                    <span class="stats-mini expense">支出 <strong id="statsDayExpense">¥0.00</strong></span>
                </div>
                <div class="table-wrap">
                    <table id="statsDayTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>类型</th>
                                <th>金额</th>
                                <th>分类</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody id="statsDayBody">
                            <tr class="empty-row"><td colspan="5">暂无记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item active" data-tab="records">
                <span class="nav-icon">📝</span>
                <span class="nav-label">记账</span>
            </button>
            <button type="button" class="nav-item" data-tab="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label">统计</span>
            </button>
        </nav>

        <!-- 新增记录弹窗（默认隐藏，点击「添加记录」按钮时弹出） -->
        <div id="addModal" class="modal-overlay" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2>新增记录</h2>
                    <button type="button" class="modal-close" id="addClose">&times;</button>
                </div>
                <form id="addForm" class="add-form">
                    <div class="form-field">
                        <span class="field-label">类型 *</span>
                        <div class="type-radio-group">
                            <label class="type-radio">
                                <input type="radio" name="fType" value="expense" checked>
                                <span class="type-radio-btn type-expense">支出</span>
                            </label>
                            <label class="type-radio">
                                <input type="radio" name="fType" value="income">
                                <span class="type-radio-btn type-income">收入</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-field">
                        <span class="field-label">一级分类 *</span>
                        <div id="fCatL1Picker" class="cat-picker"></div>
                        <input type="hidden" id="fCatL1" value="">
                    </div>
                    <div class="form-field" id="catL2Group" style="display:none;">
                        <span class="field-label">二级分类 *</span>
                        <div id="fCatL2Picker" class="cat-picker cat-picker-sub"></div>
                        <input type="hidden" id="fCatL2" value="">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fAmount">金额 *</label>
                            <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="fDatetime">时间 *</label>
                            <input type="datetime-local" id="fDatetime" required>
                        </div>
                        <div class="form-group">
                            <label for="fNote">备注</label>
                            <input type="text" id="fNote" placeholder="可选" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-sm" id="addCancel">取消</button>
                        <button type="submit" class="btn btn-primary">✓ 确认</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 编辑记录弹窗（默认隐藏，点击列表「编辑」按钮时弹出） -->
        <div id="editModal" class="modal-overlay" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2>编辑记录</h2>
                    <button type="button" class="modal-close" id="editClose">&times;</button>
                </div>
                <form id="editForm" class="add-form">
                    <input type="hidden" id="eId">
                    <div class="form-field">
                        <span class="field-label">类型 *</span>
                        <div class="type-radio-group">
                            <label class="type-radio">
                                <input type="radio" name="eType" value="expense" checked>
                                <span class="type-radio-btn type-expense">支出</span>
                            </label>
                            <label class="type-radio">
                                <input type="radio" name="eType" value="income">
                                <span class="type-radio-btn type-income">收入</span>
                            </label>
                        </div>
                    </div>
                    <div class="form-field">
                        <span class="field-label">一级分类 *</span>
                        <div id="eCatL1Picker" class="cat-picker"></div>
                        <input type="hidden" id="eCatL1" value="">
                    </div>
                    <div class="form-field" id="eCatL2Group" style="display:none;">
                        <span class="field-label">二级分类 *</span>
                        <div id="eCatL2Picker" class="cat-picker cat-picker-sub"></div>
                        <input type="hidden" id="eCatL2" value="">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="eAmount">金额 *</label>
                            <input type="number" id="eAmount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="eDatetime">时间 *</label>
                            <input type="datetime-local" id="eDatetime" required>
                        </div>
                        <div class="form-group">
                            <label for="eNote">备注</label>
                            <input type="text" id="eNote" placeholder="可选" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-sm" id="editCancel">取消</button>
                        <button type="submit" class="btn btn-primary">💾 保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
